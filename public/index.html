<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Jogo da Memória</h1>

  <div id="jogo">
    <div>
      <div id="placar">
        <span id="placar-1">Jogador 1 <em class="voce" hidden>(você)</em>: <b class="pontos">0</b></span>
        <strong id="status"></strong>
        <span id="placar-2">Jogador 2 <em class="voce" hidden>(você)</em>: <b class="pontos">0</b></span>
      </div>
      <div id="tabuleiro"></div>
      <p id="aviso"></p>
    </div>

    <div id="painel">
      <h2>Mensagens</h2>
      <ol id="log"></ol>
    </div>
  </div>

  <div id="fim" hidden>
    <h2 id="fim-titulo"></h2>
    <p id="fim-placar"></p>
    <button id="botao-novo">Jogar de novo</button>
  </div>

  <script src="pokemon.js"></script>
  <script src="app.js"></script>
</body>
</html>
